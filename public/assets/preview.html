<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ritanol colorful pixel assets</title>
  <style>
    *{box-sizing:border-box} body{margin:0;padding:24px;background:#000;color:#fff;font:16px monospace} h1{color:#ff7f27;margin:0 0 6px} p{color:#c0c0c0;margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:18px}figure{margin:0;padding:14px;border:6px solid #fff;overflow:auto;background:#000}figcaption{position:sticky;left:0;margin-bottom:12px;color:#ffff00}img{display:block;max-width:none;image-rendering:pixelated;image-rendering:crisp-edges}.wide{grid-column:1/-1;max-height:780px}.walk{width:72px;height:96px;background-repeat:no-repeat;background-size:288px 96px;image-rendering:pixelated;animation:walk .8s steps(4) infinite}.front{background-image:url('./hero-walk-front.png')}.back{background-image:url('./hero-walk-back.png')}.side{background-image:url('./hero-walk-side.png')}@keyframes walk{to{background-position-x:-288px}}.sheet{margin-top:10px}
  </style>
</head>
<body>
  <h1>RITANOL — COLORFUL STORY-RPG ASSETS</h1>
  <p>All artwork is shown at exactly 3× with nearest-neighbor browser scaling.</p>
  <main class="grid">
    <figure class="wide"><figcaption>hero-scene.png — 320×240</figcaption><img src="./hero-scene.png" width="960" height="720" alt="Colorful ruined-garden hero scene"></figure>
    <figure><figcaption>hero-idle-front.png — 24×32</figcaption><img src="./hero-idle-front.png" width="72" height="96" alt="Hero idle"></figure>
    <figure><figcaption>hero-walk-front.png — 4 × 24×32</figcaption><div class="walk front"></div><img class="sheet" src="./hero-walk-front.png" width="288" height="96" alt="Front walk sheet"></figure>
    <figure><figcaption>hero-walk-back.png — 4 × 24×32</figcaption><div class="walk back"></div><img class="sheet" src="./hero-walk-back.png" width="288" height="96" alt="Back walk sheet"></figure>
    <figure><figcaption>hero-walk-side.png — 4 × 24×32</figcaption><div class="walk side"></div><img class="sheet" src="./hero-walk-side.png" width="288" height="96" alt="Side walk sheet"></figure>
    <figure><figcaption>portrait-neutral.png — 48×48</figcaption><img src="./portrait-neutral.png" width="144" height="144" alt="Neutral portrait"></figure>
    <figure><figcaption>portrait-curious.png — 48×48</figcaption><img src="./portrait-curious.png" width="144" height="144" alt="Curious portrait"></figure>
    <figure><figcaption>portrait-smile.png — 48×48</figcaption><img src="./portrait-smile.png" width="144" height="144" alt="Smiling portrait"></figure>
    <figure><figcaption>icon-soul-jump.png — 32×32</figcaption><img src="./icon-soul-jump.png" width="96" height="96" alt="Jumping heart icon"></figure>
    <figure><figcaption>icon-super-fun-game.png — 32×32</figcaption><img src="./icon-super-fun-game.png" width="96" height="96" alt="Golden star icon"></figure>
    <figure><figcaption>icon-harness.png — 32×32</figcaption><img src="./icon-harness.png" width="96" height="96" alt="Marionette hand icon"></figure>
    <figure><figcaption>save-point.png — 3 × 32×32</figcaption><img src="./save-point.png" width="288" height="96" alt="Save point animation sheet"></figure>
    <figure><figcaption>enemy-gloamling.png — 40×40</figcaption><img src="./enemy-gloamling.png" width="120" height="120" alt="Gloamling enemy"></figure>
    <figure><figcaption>tile-ruin-floor.png — 32×32 seamless</figcaption><img src="./tile-ruin-floor.png" width="96" height="96" alt="Ruins floor tile"></figure>
    <figure><figcaption>tile-ruin-wall.png — 32×32 seamless</figcaption><img src="./tile-ruin-wall.png" width="96" height="96" alt="Ruins wall tile"></figure>
    <figure><figcaption>tile-ruin-pillar.png — 32×64</figcaption><img src="./tile-ruin-pillar.png" width="96" height="192" alt="Ruins pillar"></figure>
    <figure><figcaption>tile-flowers.png — 32×32 seamless</figcaption><img src="./tile-flowers.png" width="96" height="96" alt="Golden flower tile"></figure>
    <figure class="wide"><figcaption>character-parade.png — 320×48</figcaption><img src="./character-parade.png" width="960" height="144" alt="Seven original characters"></figure>
    <figure class="wide"><figcaption>soul-hearts.png — 8 × 32×32</figcaption><img src="./soul-hearts.png" width="768" height="96" alt="Eight soul heart states"></figure>
    <figure><figcaption>ui-atlas.png — 128×64</figcaption><img src="./ui-atlas.png" width="384" height="192" alt="Colorful UI atlas"></figure>
    <figure class="wide"><figcaption>divider-echo-flowers.png — 320×32</figcaption><img src="./divider-echo-flowers.png" width="960" height="96" alt="Echo flower divider"></figure>
    <figure><figcaption>favicon.png — 32×32</figcaption><img src="./favicon.png" width="96" height="96" alt="Red heart favicon"></figure>
  </main>
</body>
</html>
